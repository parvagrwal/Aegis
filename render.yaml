services:
  - type: web
    name: aegis-api
    runtime: python
    plan: free
    region: virginia
    rootDir: backend
    buildCommand: pip install -r requirements.lock.txt
    startCommand: uvicorn aegis.main:app --host 0.0.0.0 --port $PORT --workers 1 --proxy-headers --forwarded-allow-ips="*"
    healthCheckPath: /api/v1/health
    autoDeploy: false
